<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* General Page Styling */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f4; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .btn-trigger { background: #ff9800; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* Modal Overlay (The Dark Background) */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent black */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* The Popup Box */
        .modal-box {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Modal Header with Logo */
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
        }

        .modal-logo { height: 50px; width: auto; }

        /* Content Area */
        .modal-body { padding: 30px; color: #333; }
        .modal-body h2 { margin-top: 0; font-size: 18px; margin-bottom: 20px; color: #444; }

        /* Selection List Styles */
        .selection-list { list-style: none; padding: 0; margin: 0; }
        .selection-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .item-left { display: flex; align-items: center; }
        .radio-circle {
            width: 20px; height: 20px;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-right: 15px;
            cursor: pointer;
        }
        .selection-item.active .radio-circle {
            border-color: #ff9800;
            background: radial-gradient(#ff9800 50%, transparent 50%);
        }

        .price-text { font-weight: bold; color: #555; }

        /* Footer / Action Button */
        .modal-footer { padding: 20px 30px; text-align: right; }
        .btn-confirm {
            background: #5cb85c; /* Green like your second image */
            color: white;
            border: none;
            padding: 10px 40px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <button class="btn-trigger" onclick="toggleModal()">Place Order</button>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-box">
            
            <div class="modal-header">
                <img src="logo1.jpg" alt="FoodFrenzy Logo" class="modal-logo">
            </div>

            <div class="modal-body">
                <h2>Delivery Information</h2>
                
                <div class="selection-list">
                    <div class="selection-item active">
                        <div class="item-left">
                            <div class="radio-circle"></div>
                            <span>Payment Method</span>
                        </div>
                        <span class="price-text">$5.00</span>
                    </div>

                    <div class="selection-item">
                        <div class="item-left">
                            <div class="radio-circle"></div>
                            <span>Card/Payment</span>
                        </div>
                        <span class="price-text">$1.00</span>
                    </div>

                    <div class="selection-item">
                        <div class="item-left">
                            <div class="radio-circle"></div>
                            <span>Delivery Method</span>
                        </div>
                        <span class="price-text">$2.00</span>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-confirm" onclick="toggleModal()">Proceed</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('orderModal');
            if (modal.style.display === "flex") {
                modal.style.display = "none";
            } else {
                modal.style.display = "flex";
            }
        }

        // Close modal if clicking outside the white box
        window.onclick = function(event) {
            const modal = document.getElementById('orderModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
