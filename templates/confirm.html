<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fcfcfc; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .success-container { max-width: 600px; width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 50px; }

        /* Success Icon Styling */
        .success-icon { width: 80px; height: 80px; background-color: #dff0d8; color: #5cb85c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; border: 2px solid #5cb85c; }

        h1 { color: #5cb85c; font-size: 24px; margin-bottom: 10px; }
        p.message { color: #666; margin-bottom: 30px; font-size: 16px; }

        /* Details Table */
        .order-details-box { text-align: left; background: #f9f9f9; border-radius: 10px; padding: 20px; margin-bottom: 30px; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .detail-row:last-child { border-bottom: none; }
        .label { font-weight: bold; color: #555; }
        .value { color: #333; }

        /* Buttons */
        .btn-home { background-color: #ff9800; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.3s; }
        .btn-home:hover { background-color: #e68a00; }
        
        .logo-img { height: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <img src="/static/images/logo1.png" alt="FoodFrenzy" class="logo-img">

    <div class="success-container">
        <div class="success-icon">✓</div>
        
        <h1>Success!</h1>
        <p class="message">Your order has been placed successfully. Thank you for shopping with FoodFrenzy!</p>

        <div class="order-details-box">
            <div class="detail-row">
                <span class="label">Order ID:</span>
                <span class="value">#FF-{{ order.order_id }}</span>
            </div>
            <div class="detail-row">
                <span class="label">Total Amount:</span>
                <span class="value" style="color: #ff9800; font-weight: bold;">PKR {{ order.total_amount }}</span>
            </div>
            <div class="detail-row">
                <span class="label">Payment Method:</span>
                <span class="value">{{ payment_method }}</span>
            </div>
            <div class="detail-row" style="flex-direction: column; align-items: flex-start; gap: 5px;">
                <span class="label">Delivery Address:</span>
                <span class="value" style="font-size: 14px; line-height: 1.4;">{{ billing.address }}, {{ billing.city }}</span>
            </div>
        </div>

        <a href="/" class="btn-home">CONTINUE SHOPPING</a>
    </div>

</body>
</html>
